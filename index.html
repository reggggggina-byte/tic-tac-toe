<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Крестики-нолики онлайн</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --cell: min(24vw, 110px); }
  * { box-sizing: border-box; margin: 0; font-family: system-ui, sans-serif; }
  body {
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    color: #eee; gap: 14px; padding: 16px;
  }
  h1 { font-size: 1.4em; }
  .status { min-height: 1.5em; font-size: 1.1em; text-align: center; }
  .board {
    display: grid; grid-template-columns: repeat(3, var(--cell)); grid-auto-rows: var(--cell);
    gap: 6px; border: 2px solid #e94560; border-radius: 12px; padding: 6px;
  }
  .cell {
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.15);
    border-radius: 8px; display: flex; align-items: center; justify-content: center;
    font-size: calc(var(--cell) * .55); font-weight: bold; cursor: pointer;
    user-select: none; transition: background .15s;
  }
  .cell:hover { background: rgba(255,255,255,.14); }
  .cell.x { color: #e94560; } .cell.o { color: #4ade80; }
  .cell.win { background: rgba(233,69,96,.35); }
  button {
    padding: 10px 22px; border: none; border-radius: 8px; background: #e94560;
    color: #fff; font-size: 1em; cursor: pointer;
  }
  button:hover { filter: brightness(1.1); }
  #link { max-width: 90vw; font-size: .8em; opacity: .7; overflow: hidden; text-overflow: ellipsis; }
  #link { word-break: break-all; }

  /* --- панель для рисования --- */
  #doodleWrap { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  #doodle {
    border: 2px solid rgba(255,255,255,.25); border-radius: 12px;
    background: rgba(255,255,255,.05); cursor: crosshair; touch-action: none;
  }
  #doodleTools { display: flex; gap: 8px; align-items: center; }
  #doodleTools button { padding: 6px 14px; font-size: .9em; }
  #penColor { width: 32px; height: 32px; border: none; border-radius: 8px; cursor: pointer; }

  /* --- кошка --- */
  #cat { cursor: default; user-select: none; }
</style>
</head>
<body>
  <h1>✕ Крестики-нолики ⭕</h1>
  <div class="status" id="status">Загрузка…</div>
  <div class="board" id="board"></div>
  <button onclick="newGame()">Новая игра</button>
  <div id="link"></div>

  <!-- панель для рисования -->
  <div id="doodleWrap">
    <canvas id="doodle" width="300" height="180"></canvas>
    <div id="doodleTools">
      <input type="color" id="penColor" value="#4ade80" title="Цвет карандаша">
      <button onclick="clearDoodle()">Стереть всё</button>
    </div>
  </div>

  <!-- чёрная кошка, следящая за курсором -->
  <svg id="cat" width="150" height="110" viewBox="0 0 150 110">
    <!-- уши -->
    <polygon points="35,35 48,5  62,32" fill="#111"/>
    <polygon points="115,35 102,5  88,32" fill="#111"/>
    <!-- голова -->
    <ellipse cx="75" cy="55" rx="45" ry="40" fill="#111"/>
    <!-- глаза: белок -->
    <circle cx="55" cy="50" r="13" fill="#fff"/>
    <circle cx="95" cy="50" r="13" fill="#fff"/>
    <!-- зрачки (их двигаем скриптом) -->
    <circle id="pupilL" cx="55" cy="50" r="5.5" fill="#ffd54a"/>
    <circle id="pupilR" cx="95" cy="50" r="5.5" fill="#ffd54a"/>
    <!-- нос и усы -->
    <polygon points="75,66 70,72 80,72" fill="#e94560"/>
    <line x1="62" y1="72" x2="20" y2="66" stroke="#999" stroke-width="1.5"/>
    <line x1="62" y1="76" x2="22" y2="80" stroke="#999" stroke-width="1.5"/>
    <line x1="88" y1="72" x2="130" y2="66" stroke="#999" stroke-width="1.5"/>
    <line x1="88" y1="76" x2="128" y2="80" stroke="#999" stroke-width="1.5"/>
  </svg>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyC6E6NkQ8wr3SjZJmtWLqgnbwAFukDqfDg",
  authDomain: "regina-10159.firebaseapp.com",
  databaseURL: "https://regina-10159-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "regina-10159",
  storageBucket: "regina-10159.firebasestorage.app",
  messagingSenderId: "135727435934",
  appId: "1:135727435934:web:474051f773d864ab1eeb8f"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const winnerLines = [
  [0,1,2],[3,4,5],[6,7,8],
  [0,3,6],[1,4,7],[2,5,8],
  [0,4,8],[2,4,6]
];

// --- идентификатор игрока и роль ---
const url = new URL(location.href);
let roomId = url.searchParams.get("room");
const myId = Math.random().toString(36).slice(2);
let myRole = null; // 'host' | 'guest'

const statusEl = document.getElementById("status");
const boardEl = document.getElementById("board");
const cells = [];

for (let i = 0; i < 9; i++) {
  const c = document.createElement("div");
  c.className = "cell";
  c.onclick = () => move(i);
  boardEl.appendChild(c);
  cells.push(c);
}

async function join() {
  if (!roomId) {
    roomId = Math.random().toString(36).slice(2, 10);
    history.replaceState(null, "", "?room=" + roomId);
  }
  const ref = db.ref("games/" + roomId);
  let snap;
  try {
    snap = await ref.get();
  } catch (e) {
    statusEl.textContent = "Ошибка подключения: " + e.code + " — " + e.message;
    console.error(e);
    return;
  }

  if (!snap.exists()) {
    try {
      await ref.set({ board: Array(9).fill(""), turn: "X", started: Date.now() });
    } catch (e) {
      statusEl.textContent = "Не удалось создать игру: " + e.code;
      console.error(e);
      return;
    }
    myRole = "host";
  } else if (snap.child("players").exists() &&
             snap.child("players/guest").exists()) {
    statusEl.textContent = "Комната уже занята: в игре два игрока 🙂";
    return;
  } else {
    await ref.child("players/guest").set(myId);
    myRole = "guest";
  }

  document.getElementById("link").textContent = "Ссылка для друга: " + location.href;
  document.title = "Комната " + roomId;

  ref.on("value", onState);
}

function onState(snap) {
  const g = snap.val();
  if (!g) return;
  const board = Array.isArray(g.board) ? g.board : Array(9).fill("");
  const winner = getWinner(board);

  cells.forEach((c, i) => {
    c.textContent = board[i];
    c.className = "cell" + (board[i] === "X" ? " x" : board[i] === "O" ? " o" : "")
                + (winner && winner.line.includes(i) ? " win" : "");
    const occupied = board[i] !== "";
    const notMyTurn = !myRole || (g.turn !== symbol());
    c.style.cursor = (occupied || notMyTurn || winner || c.classList.contains("win"))
      ? "default" : "pointer";
  });

  if (winner) {
    statusEl.textContent = winner.who === "draw"
      ? "Ничья! Сыграем ещё раз?"
      : `Победил: ${winner.who === "X" ? "✕ крестики" : "⭕ нолики"}! 🎉`;
  } else if (!myRole) {
    statusEl.textContent = "Подключение…";
  } else {
    statusEl.textContent = `Вы — ${symbol() === "X" ? "✕" : "⭕"}. ` +
      (g.turn === symbol() ? "Ваш ход" : "Ход соперника… а пока — порисуй и погладь кошку");
  }
}

function symbol() {
  return myRole === "host" ? "X" : "O";
}

function getWinner(board) {
  for (const [a, b, c] of winnerLines) {
    if (board[a] && board[a] === board[b] && board[a] === board[c])
      return { who: board[a], line: [a, b, c] };
  }
  if (board.every(Boolean)) return { who: "draw", line: [] };
  return null;
}

function move(i) {
  if (!myRole) return;
  const ref = db.ref("games/" + roomId);
  ref.get().then(snap => {
    const g = snap.val();
    if (!g) return;
    const board = Array.isArray(g.board) ? g.board : Array(9).fill("");
    if (board[i] !== "" || g.turn !== symbol()) return;
    if (getWinner(board)) return;
    board[i] = g.turn;
    const w = getWinner(board);
    const upd = { board, turn: w ? g.turn : (g.turn === "X" ? "O" : "X") };
    ref.update(upd);
  });
}

function newGame() {
  db.ref("games/" + roomId).update({
    board: Array(9).fill(""), turn: "X", players: null
  });
}

join();

/* ================= ПАНЕЛЬ ДЛЯ РИСОВАНИЯ ================= */
const doodle = document.getElementById("doodle");
const ctx = doodle.getContext("2d");
const penColor = document.getElementById("penColor");
let drawing = false;

function doodlePos(e) {
  const r = doodle.getBoundingClientRect();
  const t = e.touches ? e.touches[0] : e;
  return [(t.clientX - r.left) * (doodle.width / r.width),
          (t.clientY - r.top) * (doodle.height / r.height)];
}

function doodleStart(e) {
  e.preventDefault();
  drawing = true;
  const [x, y] = doodlePos(e);
  ctx.strokeStyle = penColor.value;
  ctx.lineWidth = 3;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(x, y);
}
function doodleMove(e) {
  if (!drawing) return;
  e.preventDefault();
  const [x, y] = doodlePos(e);
  ctx.lineTo(x, y);
  ctx.stroke();
}
function doodleEnd() { drawing = false; }

doodle.addEventListener("mousedown", doodleStart);
doodle.addEventListener("mousemove", doodleMove);
doodle.addEventListener("mouseup", doodleEnd);
doodle.addEventListener("mouseleave", doodleEnd);
doodle.addEventListener("touchstart", doodleStart);
doodle.addEventListener("touchmove", doodleMove);
doodle.addEventListener("touchend", doodleEnd);

function clearDoodle() {
  ctx.clearRect(0, 0, doodle.width, doodle.height);
}

/* ================= КОШКА, СЛЕДЯЩАЯ ЗА КУРСОРОМ ================= */
const pupilL = document.getElementById("pupilL");
const pupilR = document.getElementById("pupilR");
const MAX = 6; // насколько далеко ходят зрачки внутри глаза

document.addEventListener("mousemove", e => {
  const cat = document.getElementById("cat");
  const r = cat.getBoundingClientRect();
  // центр каждого глаза в координатах страницы
  const eyes = [
    { cx: r.left + r.width * (55 / 150), cy: r.top + r.height * (50 / 110) },
    { cx: r.left + r.width * (95 / 150), cy: r.top + r.height * (50 / 110) }
  ];
  eyes.forEach((eye, i) => {
    const dx = e.clientX - eye.cx, dy = e.clientY - eye.cy;
    const dist = Math.hypot(dx, dy) || 1;
    const px = (dx / dist) * Math.min(MAX, dist / 20);
    const py = (dy / dist) * Math.min(MAX, dist / 20);
    (i === 0 ? pupilL : pupilR).setAttribute("transform", `translate(${px} ${py})`);
  });
});

// если курсора нет (телефон) — зрачки бегают сами
let t = 0;
setInterval(() => {
  if (matchMedia("(hover: none)").matches) {
    t += 0.15;
    const px = Math.cos(t) * MAX, py = Math.sin(t * 1.3) * MAX * .5;
    pupilL.setAttribute("transform", `translate(${px} ${py})`);
    pupilR.setAttribute("transform", `translate(${px} ${py})`);
  }
}, 50);
</script>
</body>
</html>
